<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Просмотр скриншотов">
<img class="lb-img" id="lbImg" src="" alt="">
<div class="lb-cap" id="lbCap"></div>

<button class="lb-btn lb-prev" id="lbPrev" aria-label="Предыдущий скриншот"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
<button class="lb-btn lb-next" id="lbNext" aria-label="Следующий скриншот"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></button>
<button class="lb-btn lb-close" id="lbClose" aria-label="Закрыть просмотр"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
</div>

<script src="../../assets/js/site.js"></script>
<script>
(function () {
    var items = Array.prototype.slice.call(document.querySelectorAll('.shot-item'));
    var lb = document.getElementById('lb'), img = document.getElementById('lbImg'),
        cap = document.getElementById('lbCap'), cnt = document.getElementById('lbCount'), i = 0;
    function show(n) {
        i = (n + items.length) % items.length;
        img.src = items[i].querySelector('img').src;
        img.alt = items[i].dataset.cap;
        cap.textContent = items[i].dataset.cap;
        cnt.textContent = (i + 1) + ' / ' + items.length;
    }
    function open(n) { lb.classList.add('open'); document.body.style.overflow = 'hidden'; show(n); }
    function close() { lb.classList.remove('open'); document.body.style.overflow = ''; }
    items.forEach(function (el, n) { el.addEventListener('click', function () { open(n); }); });
    document.getElementById('lbPrev').addEventListener('click', function (e) { e.stopPropagation(); show(i - 1); });
    document.getElementById('lbNext').addEventListener('click', function (e) { e.stopPropagation(); show(i + 1); });
    document.getElementById('lbClose').addEventListener('click', close);
    lb.addEventListener('click', function (e) { if (e.target === lb) close(); });
    var tx = 0;
    lb.addEventListener('touchstart', function (e) { tx = e.changedTouches[0].clientX; }, { passive: true });
    lb.addEventListener('touchend', function (e) {
        var dx = e.changedTouches[0].clientX - tx;
        if (Math.abs(dx) > 50) show(dx > 0 ? i - 1 : i + 1);
    }, { passive: true });
    document.addEventListener('keydown', function (e) {
        if (!lb.classList.contains('open')) return;
        if (e.key === 'ArrowLeft') show(i - 1);
        else if (e.key === 'ArrowRight') show(i + 1);
        else if (e.key === 'Escape') close();
    });
})();
</script>
